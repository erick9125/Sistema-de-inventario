{% extends "base/base.html" %}

{% block titulo %}Eliminar PDA{% endblock %}

{% block contenido %}
<div class="app-page-header"><h1>Eliminar PDA</h1></div>
<div class="app-card">
  <p class="mb-4">¿Desea eliminar la PDA <strong>{{ object.serie_pda }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-danger" type="submit">Eliminar</button>
      <a class="btn btn-outline-secondary" href="{% url 'pda:pda_listar' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
