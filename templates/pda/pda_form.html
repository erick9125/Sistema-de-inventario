{% extends "base/base.html" %}

{% block titulo %}PDA{% endblock %}

{% block contenido %}
<div class="app-page-header">
  <h1>{% if object %}Editar PDA{% else %}Nueva PDA{% endif %}</h1>
</div>
<div class="app-card">
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "partials/form_grid.html" %}
    <div class="d-flex flex-wrap gap-2 mt-4">
      <button class="btn btn-primary" type="submit">{% if object %}Guardar cambios{% else %}Registrar{% endif %}</button>
      <a class="btn btn-outline-secondary" href="{% url 'pda:pda_listar' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
