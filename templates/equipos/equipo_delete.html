{% extends "base/base.html" %}

{% block titulo %}Eliminar equipo{% endblock %}

{% block contenido %}
<div class="app-page-header">
  <h1>Eliminar equipo</h1>
</div>
<div class="app-card">
  <p class="mb-4">¿Desea eliminar el equipo <strong>{{ object.marca }} {{ object.modelo }}</strong> (ID {{ object.id }})?</p>
  <form method="post">
    {% csrf_token %}
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-danger" type="submit">Eliminar</button>
      <a class="btn btn-outline-secondary" href="{% url 'equipos:equipo_listar' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
