{% if messages %}
<div class="toast-container position-fixed top-0 end-0 p-3">
  {% for message in messages %}
  {% with level=message.tags|default:"info" %}
  <div
    class="toast align-items-center text-bg-{% if level == 'error' %}danger{% elif level == 'debug' %}secondary{% else %}{{ level }}{% endif %} border-0"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="d-flex">
      <div class="toast-body">{{ message }}</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
    </div>
  </div>
  {% endwith %}
  {% endfor %}
</div>
{% endif %}
