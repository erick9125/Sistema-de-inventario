{% extends "base/baseLogin.html" %}
{% load static %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-11 col-sm-8 col-md-5 col-lg-4">
    <div class="card login-card text-center p-4">
      <img class="login-avatar mx-auto" src="{% static 'img/user.png' %}" alt="Usuario">
      <h1 class="h4 mb-4">Iniciar sesion</h1>
      <form action="/postsign/" method="post" class="text-start">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="id_email">Correo</label>
          <input id="id_email" type="email" name="email" class="form-control" placeholder="correo@empresa.com" required autocomplete="username">
        </div>
        <div class="mb-4">
          <label class="form-label" for="id_password">Contrasena</label>
          <input id="id_password" type="password" name="password" class="form-control" placeholder="Contrasena" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
